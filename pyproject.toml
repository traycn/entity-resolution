[project]
name = "resolver"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "polars>=1.0",
  "rapidfuzz>=3.0",
  "phonenumbers>=8.13",
  "email-validator>=2.1",
  "typer>=0.12",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "faker>=25.0",
  "matplotlib>=3.8",
]

[project.scripts]
resolver = "resolver.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "mypy>=1.10",
    "httpx>=0.28.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/resolver"]
