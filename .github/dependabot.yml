version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"

  # Python dependencies: pyproject.toml + uv.lock
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "monthly"

  # Review UI: review-ui/package.json + package-lock.json
  - package-ecosystem: "npm"
    directory: "/review-ui"
    schedule:
      interval: "monthly"
