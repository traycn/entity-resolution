# Scoring configuration (Milestone 4). Read by resolver.scoring.load_config.
# Override the path with the RESOLVER_CONFIG environment variable.

[policy]
# Auto-merge policy: a pair is MATCHed (merged without a human) ONLY when the two
# records share an exact normalized email or phone and their first names agree (see
# min_first_name_similarity), and then:
#   - similar but not identical first names: the other identifier must not differ
#     (else REVIEW, rule="exact_id_other_mismatch");
#   - identical first names: the birth dates must not differ when both are present
#     (else REVIEW, rule="exact_id_dob_mismatch"; a same-name parent and child).
# The weighted fuzzy score never auto-merges on its own: it only decides between
# REVIEW (human queue) and NO_MATCH.
#
# Why: fuzzy agreement on name + address cannot tell a person from a same-named
# family member at the same address, a look-alike email is a *different*
# identifier, and a shared household phone next to two different emails is two
# people. Measured effects: docs/results.md (regenerated by `make eval`).
#
# Set to true to let a weighted score >= thresholds.match auto-merge (subject to
# min_match_weight and the differing-identifier cap).
allow_weighted_match = false

[thresholds]
# Weighted score >= match -> MATCH (only if allow_weighted_match), >= review -> REVIEW,
# otherwise NO_MATCH.
match = 0.92
review = 0.75
# A weighted MATCH also needs at least this much (pre-normalization) weight of fields
# present on both records, else it is capped at REVIEW. 0.50 > name + address (0.40).
min_match_weight = 0.50
# An exact email/phone match only auto-merges when the first names' Jaro-Winkler
# similarity (nickname-normalized, swapped first/last allowed) reaches this value;
# below it the pair is a shared household identifier -> REVIEW.
# Sweep over seeds (households merged vs true exact-id dups sent to REVIEW):
# docs/results.md and docs/threshold_sweep.png.
min_first_name_similarity = 0.80

[weights]
# Missing fields are excluded and the remaining weights re-normalized.
email = 0.35
phone = 0.25
name = 0.25
address = 0.15
